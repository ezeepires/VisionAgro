<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionAgro</title>
    <style>
        :root {
            --bg-base: #09090b;       
            --bg-surface: #18181b;    
            --bg-input: #27272a;      
            --border-color: #3f3f46;  
            --text-primary: #fafafa;  
            --text-muted: #a1a1aa;    
            --accent: #10b981;        
            --accent-hover: #059669;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: var(--bg-base); 
            background-image: radial-gradient(circle at 50% -20%, #1f2937 0%, transparent 60%);
            color: var(--text-primary); 
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; 
        }
        
        /* Cabeçalho */
        header { background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(63, 63, 70, 0.5); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: 1px; color: var(--text-primary); text-transform: uppercase;}
        h1 span { color: var(--accent); }
        
        /* Status Pulsante */
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--accent); background: rgba(16, 185, 129, 0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-dot { width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        /* Container Principal */
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; max-width: 800px; width: 100%; margin: 0 auto; gap: 28px; }

        /* Moldura de Vídeo com HUD (Heads-Up Display) */
        .video-wrapper { width: 100%; background-color: #000; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 50px rgba(0,0,0,0.7); aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
        .video-wrapper::before, .video-wrapper::after { content: ''; position: absolute; width: 40px; height: 40px; border-color: rgba(16, 185, 129, 0.6); border-style: solid; z-index: 2; pointer-events: none; transition: all 0.3s ease;}
        .video-wrapper::before { top: 12px; left: 12px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
        .video-wrapper::after { bottom: 12px; right: 12px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }
        .video-feed { width: 100%; height: 100%; object-fit: cover; display: block; filter: contrast(1.05) saturate(1.1); }
        .camera-overlay { position: absolute; top: 20px; left: 24px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; color: #fff; letter-spacing: 1px; border: 1px solid rgba(255,255,255,0.15); z-index: 3;}
        .camera-target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 2; pointer-events: none;}

        /* Botão de Captura com Efeito Shine */
        .capture-trigger { position: relative; overflow: hidden; width: 100%; max-width: 400px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); color: #fff; border: none; padding: 20px 24px; font-size: 1.15rem; font-weight: 700; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: all 0.2s ease; box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3); letter-spacing: 1px; -webkit-tap-highlight-color: transparent; }
        .capture-trigger::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: skewX(-20deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        .capture-trigger:active { transform: scale(0.97); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .capture-icon { font-size: 1.5rem; }

        /* Modal com Efeito Apple (Elástico) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 100; align-items: center; justify-content: center; padding: 20px; opacity: 0; animation: fadeIn 0.2s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .modal-box { background-color: var(--bg-surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; width: 100%; max-width: 380px; padding: 32px 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.9); transform: translateY(40px) scale(0.95); animation: elasticUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes elasticUp { to { transform: translateY(0) scale(1); } }
        
        .modal-box h2 { color: var(--text-primary); font-size: 1.3rem; margin-bottom: 24px; text-align: center; font-weight: 700; letter-spacing: 0.5px;}
        
        /* Campos de Input Super Premium */
        .input-block { margin-bottom: 20px; }
        .input-block label { display: block; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
        .input-field { width: 100%; background-color: var(--bg-input); border: 1px solid transparent; color: var(--text-primary); padding: 18px; border-radius: 14px; font-size: 1.2rem; text-align: center; font-weight: 700; transition: all 0.2s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .input-field:focus { border-color: var(--accent); outline: none; background-color: #1f1f22; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 3px rgba(16, 185, 129, 0.2); }
        .input-field::placeholder { color: #52525b; font-weight: 500; }
        
        /* Botões do Modal */
        .modal-buttons { display: flex; gap: 12px; margin-top: 32px; }
        .btn { flex: 1; padding: 16px; font-size: 1rem; font-weight: 700; border-radius: 14px; cursor: pointer; border: none; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; text-transform: uppercase; letter-spacing: 0.5px;}
        .btn-confirm { background-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-confirm:active { background-color: var(--accent-hover); transform: scale(0.96); }
        .btn-abort { background-color: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-abort:active { background-color: var(--bg-input); transform: scale(0.96); }

        /* TOAST NOTIFICATION (Substitui o alert feio) */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
        .toast { background-color: var(--bg-surface); border: 1px solid var(--border-color); color: #fff; padding: 16px 24px; border-radius: 50px; font-size: 0.95rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; transform: translateY(-100px); opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 4px solid var(--accent); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast-icon { font-size: 1.2rem; }

        footer { text-align: center; padding: 24px; font-size: 0.75rem; color: #52525b; font-weight: 600; letter-spacing: 1px; border: 1px;}
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <header>
        <h1>Vision<span>Agro</span></h1>
        <div class="status-badge">
            <span class="status-dot"></span>
            Ao Vivo
        </div>
    </header>

    <div class="main-container">
        <div class="video-wrapper" id="cameraFrame">
            <span class="camera-overlay">LENTE_01 | HD</span>
            <div class="camera-target"></div>
            <img class="video-feed" src="{{ url_for('video_feed') }}" alt="Feed de Monitoramento">
        </div>

        <button class="capture-trigger" onclick="abrirModal()">
            <span>Registrar Planta</span>
        </button>
    </div>

    <div id="dataModal" class="modal-overlay">
        <div class="modal-box">
            <h2>Mapeamento de Solo</h2>
            
            <div class="input-block">
                <label for="txtFileira">Número da Fileira / Linha</label>
                <input type="number" id="txtFileira" class="input-field" pattern="[0-9]*" inputmode="numeric" placeholder="Ex: 14" autocomplete="off">
            </div>

            <div class="input-block">
                <label for="txtPe">Número do Pé / Planta</label>
                <input type="number" id="txtPe" class="input-field" pattern="[0-9]*" inputmode="numeric" placeholder="Ex: 42" autocomplete="off">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-abort" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-confirm" id="btnSalvar" onclick="enviarDados()">Salvar Foto</button>
            </div>
        </div>
    </div>

    <footer>
        VisionAgro
    </footer>

    <script>
        // Função para mostrar Notificações Profissionais (Toast)
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? '✅' : '⚠️';
            toast.innerHTML = `<span class="toast-icon">${icon}</span> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Ativa a animação de entrada
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove após 3.5 segundos
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); // Aguarda animação de saída
            }, 3500);
        }

        function abrirModal() {
            document.getElementById('dataModal').style.display = 'flex';
            // Efeito visual no HUD da câmera ao abrir o modal
            document.getElementById('cameraFrame').style.transform = 'scale(0.98)';
            setTimeout(() => document.getElementById('txtFileira').focus(), 150);
        }

        function fecharModal() {
            const modal = document.getElementById('dataModal');
            modal.style.display = 'none';
            document.getElementById('cameraFrame').style.transform = 'scale(1)';
            document.getElementById('txtFileira').value = '';
            document.getElementById('txtPe').value = '';
        }

        function enviarDados() {
            const fileira = document.getElementById('txtFileira').value.trim() || "Geral";
            const pe = document.getElementById('txtPe').value.trim() || "Sem_Numero";

            const btnSalvar = document.getElementById('btnSalvar');
            const textoOriginal = btnSalvar.innerText;
            btnSalvar.innerText = "Processando...";
            btnSalvar.disabled = true;
            btnSalvar.style.opacity = '0.7';

            fetch('/capturar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fileira: fileira, pe: pe })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "sucesso") {
                    showToast("Registro salvo na Fileira " + fileira, "success");
                } else {
                    showToast("Erro no sensor: " + data.mensagem, "error");
                }
            })
            .catch(err => {
                showToast("Conexão com o robô perdida.", "error");
            })
            .finally(() => {
                btnSalvar.innerText = textoOriginal;
                btnSalvar.disabled = false;
                btnSalvar.style.opacity = '1';
                fecharModal();
            });
        }
    </script>
</body>
</html>
